# Replace the host and root. Add TLS before exposing to the internet.
server {
    listen 80;
    server_name your-domain.example;
    root /var/www/twofa/dist;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Legacy path and query links may contain secrets. Do not log them.
    access_log off;
    location / {
        try_files $uri $uri/ =404;
    }
    location /2fa/ {
        try_files /index.html =404;
    }
}
